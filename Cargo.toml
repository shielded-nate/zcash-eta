[workspace]
members = ["zcash-eta", "offline", "headless", "web-server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
color-eyre = "0.6"
include_dir = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["full"] }
tower = "0.5"

zcash-eta = { path = "./zcash-eta" }
zcash-eta-offline = { path = "./offline" }
zcash-eta-headless = { path = "./headless" }
zcash-eta-web-server = { path = "./web-server" }
